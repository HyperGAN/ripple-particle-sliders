[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ripple-native95-candidate"
version = "0.0.1"
requires-python = ">=3.11,<3.15"
dependencies = ["particle-sliders-core[fibo-hndl] @ git+https://github.com/HyperGAN/particle-sliders.git@119d7e0559bacdc49847961c1b243ac08daa013c#subdirectory=packages/particle-sliders-core", "particlegan==0.10.1", "torch==2.9.1", "transformers==4.57.6", "hndl==0.10.0", "hypergan @ git+https://github.com/HyperGAN/HyperGAN.git@5f368a3770cf5bdae0448995c9f76e29af8049f7"]
[project.entry-points."particle_sliders.response_backends"]
ripple_native95 = "ripple_native95.factory:TRAINING"
[project.entry-points."particle_sliders.inference_backends"]
ripple_native95 = "ripple_native95.factory:INFERENCE"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
ripple_native95 = ["*.json", "vendor/*.json", "vendor/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
